[package]
name = "seed"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "seed"
path = "src/main.rs"

[dependencies]
game-core = { path = "../../crates/game-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
